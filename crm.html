<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM NEXUM</title>
<meta name="theme-color" content="#0B1638">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--ink:#0A1733;--ink2:#13244D;--ink3:#26406F;--bg:#F4F4F8;--card:#fff;--line:#E2E1EC;--line2:#EEEDF4;--txt:#1B1A2E;--mut:#696784;--pri:#1A5CFF;--pri-d:#0B47D6;--pri-s:#E8F0FF;--ok:#0E8A5F;--ok-s:#E3F4EC;--warn:#A86A12;--warn-s:#FBF1DF;--bad:#C23B3B;--bad-s:#FBE7E7;--wa:#1FA855;--soft:#FAFAFC;--hover:#F7F6FB;--r:12px;--rs:8px;--f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--sh:0 1px 2px rgba(10,23,51,.06),0 1px 1px rgba(10,23,51,.04);--sh2:0 12px 32px rgba(10,23,51,.12)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:var(--f);color:var(--txt);background:var(--bg);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--rs);padding:8px 14px;min-height:38px;font-weight:600;background:var(--pri);color:#fff;white-space:nowrap;transition:background .15s}.btn:hover{background:var(--pri-d)}.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:#fff;color:var(--txt);border-color:var(--line)}.btn.sec:hover{background:var(--hover)}.btn.ghost{background:none;color:var(--pri);min-height:32px;padding:6px 10px}.btn.ghost:hover{background:var(--pri-s)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13px}.btn.ok{background:var(--ok)}.btn.ok:hover{background:#0B7550}.btn.bad{background:var(--bad)}.btn svg.i{width:16px;height:16px}
.ib{width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--line);background:#fff;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;flex:none}.ib:hover{background:var(--hover);color:var(--txt)}.ib.on{background:var(--pri-s);border-color:#C9D8FF;color:var(--pri)}
.inp{width:100%;border:1px solid var(--line);border-radius:var(--rs);padding:9px 12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
.hint{color:var(--mut);font-size:13px}.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#EFEEF5;color:var(--mut);white-space:nowrap;line-height:18px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
/* login */
.lg{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh;min-height:100dvh}
.lg-art{background:radial-gradient(700px 500px at 85% 0%,rgba(30,123,255,.35),transparent 60%),var(--ink);color:#fff;padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between}
.lg-art h1{font-size:clamp(34px,4.4vw,56px);line-height:1.03;letter-spacing:-.035em;margin:0;max-width:12ch}.lg-art p{opacity:.72;max-width:42ch;margin:16px 0 0}
.lg-lista{display:grid;gap:12px;margin-top:28px;max-width:420px}.lg-lista div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;font-weight:500}.lg-lista svg.i{color:#7FB2FF}
.lg-form{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:#fff}.lg-c{width:100%;max-width:380px}.lg-c h2{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}.lg-c label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:28px;width:auto;display:block}.brand span{border-left:2px solid #1E7BFF;padding-left:10px;font-weight:600;font-size:13px;letter-spacing:.12em;color:rgba(255,255,255,.75);line-height:1.1}
/* layout */
.app{display:grid;grid-template-columns:248px minmax(320px,380px) minmax(0,1fr) 312px;height:100vh;height:100dvh}
.emb .app{grid-template-columns:220px minmax(290px,340px) minmax(0,1fr) 290px}
.nav{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;gap:2px}
.nav .brand{padding:2px 8px 18px}
.nav h6{margin:14px 10px 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.42);font-weight:700}
.nav button{width:100%;display:flex;align-items:center;gap:11px;border:0;background:none;color:rgba(255,255,255,.68);padding:8px 10px;border-radius:8px;text-align:left;font-weight:500;font-size:14px}
.nav button:hover{background:var(--ink2);color:#fff}.nav button.on{background:var(--ink3);color:#fff}
.nav button .dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 5px}.nav button .n{margin-left:auto;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.12);border-radius:99px;padding:0 8px;line-height:20px;min-width:22px;text-align:center}.nav button .n.r{background:#E11D48;color:#fff}
.nav .wa-st{margin-top:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.nav .eu{margin-top:auto;padding:14px 8px 2px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;display:flex;gap:10px;align-items:center}.nav .eu .av{width:34px;height:34px;font-size:13px}.nav .eu b{display:block;color:#fff;font-weight:600}.nav .eu small{color:rgba(255,255,255,.55)}.nav .eu button{width:auto;padding:6px;margin-left:auto}
.lst{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lst-h{padding:16px 16px 12px;border-bottom:1px solid var(--line2)}.lst-h h2{margin:0 0 12px;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.busca{position:relative}.busca svg.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);width:17px;height:17px}.busca .inp{padding-left:36px;background:var(--soft)}
.tabs{display:flex;gap:2px;background:#F0EFF5;border-radius:9px;padding:3px;margin-top:10px}.tabs button{flex:1;border:0;background:none;padding:6px 4px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--mut)}.tabs button.on{background:#fff;color:var(--txt);box-shadow:var(--sh)}
.mt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.mt div{border:1px solid var(--line2);border-radius:9px;padding:7px 9px;background:var(--soft)}.mt b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}.mt span{font-size:11px;color:var(--mut);line-height:1.2;display:block}
.lst-b{overflow-y:auto;flex:1}
.it{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative;transition:background .12s}.it:hover{background:var(--hover)}.it.on{background:var(--pri-s)}.it.on::after{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--pri)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;position:relative;letter-spacing:.02em}
.av .cn{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff}.av .cn svg.i{width:10px;height:10px;stroke-width:2.6}
.it .tx{flex:1;min-width:0}.it .l1{display:flex;gap:6px;align-items:baseline}.it .l1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.it .l1 time{font-size:11.5px;color:var(--mut);flex:none}.it.nl .l1 time{color:var(--wa);font-weight:700}
.it .l2{display:flex;gap:6px;align-items:center;margin-top:2px}.it .l2 span{flex:1;min-width:0;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it.nl .l2 span{color:var(--txt)}.it .nlq{background:var(--wa);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;min-width:20px;line-height:20px;text-align:center;flex:none}
.it .l3{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.it.urg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad)}
.vazio{padding:48px 24px;text-align:center;color:var(--mut)}.vazio svg.i{width:34px;height:34px;color:#B9B7CC;margin-bottom:8px}
/* conversa */
.ch{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.ch{container-type:inline-size}.ch-acoes{flex:none}@container (max-width:760px){.ch-acoes .tx-b{display:none}.ch .ch-h select{min-width:0;max-width:130px}}@container (max-width:580px){.ch .ch-h select{min-width:0;max-width:100px}.ch .ch-h .nm{min-width:70px}.ch .ch-acoes{gap:4px}}@container (max-width:480px){.ch .ch-h{flex-wrap:wrap;row-gap:8px;padding-bottom:8px}.ch .ch-acoes{width:100%}.ch .ch-h select{flex:1;max-width:none}}
.ch-h{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:64px}
.ch-h .nm{flex:1;min-width:0}.ch-h .nm b{font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch-h .nm span{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}.ch-h .nm span i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.ch-h select{width:auto;min-width:150px;padding:7px 10px;font-size:13px}
.ch-acoes{display:flex;gap:6px;align-items:center}
.ch-b{flex:1;overflow-y:auto;padding:20px max(16px,5%);background-color:#F2F3F8;background-image:radial-gradient(rgba(26,92,255,.05) 1px,transparent 1px);background-size:20px 20px}
.m{max-width:68%;margin:5px 0;padding:9px 12px 6px;border-radius:14px;background:#fff;box-shadow:var(--sh);white-space:pre-wrap;word-wrap:break-word;line-height:1.5;border-top-left-radius:4px}
.m small{display:block;font-size:11.5px;font-weight:700;color:var(--pri);margin-bottom:2px}.m .h{display:flex;justify-content:flex-end;gap:4px;align-items:center;font-size:11px;color:var(--mut);margin-top:3px}
.m.eu{margin-left:auto;background:var(--pri);color:#fff;border-radius:14px;border-top-right-radius:4px}.m.eu small{color:rgba(255,255,255,.8)}.m.eu .h{color:rgba(255,255,255,.75)}.m.eu a{color:#fff}.m.eu .lido{color:#9FE1FF}
.m.bot{margin-left:auto;background:#E9EDF8;border-radius:14px;border-top-right-radius:4px}.m.bot small{color:#4A5BD4}
.m.nota{margin:10px auto;background:#FFF8E1;border:1px dashed #E2BC4A;max-width:78%;border-radius:12px;box-shadow:none}.m.nota small{color:#8A6100}
.m.sis{margin:12px auto;background:rgba(255,255,255,.85);font-size:12px;color:var(--mut);text-align:center;max-width:80%;box-shadow:none;border-radius:99px;padding:5px 14px}
.m img.fx{display:block;max-width:240px;max-height:240px;border-radius:10px;margin-top:6px;cursor:zoom-in}.m .ax{display:inline-flex;gap:6px;align-items:center;margin-top:6px;padding:6px 10px;border-radius:8px;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.85);color:var(--txt);font-size:13px;font-weight:600;text-decoration:none}
.m .pg{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.95);color:var(--txt);font-size:13px;display:flex;gap:8px;align-items:center}
.dia{text-align:center;margin:14px 0}.dia span{background:#fff;border:1px solid var(--line2);border-radius:99px;padding:3px 12px;font-size:11.5px;font-weight:600;color:var(--mut)}
.cp{background:#fff;border-top:1px solid var(--line);padding:10px 16px 12px}
.cp-t{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.ferr{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--txt);position:relative}.ferr:hover{background:var(--hover)}.ferr svg.i{width:15px;height:15px;color:var(--mut)}.ferr.on{background:#FFF8E1;border-color:#E2BC4A;color:#8A6100}.ferr.on svg.i{color:#8A6100}
.ferr select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.cp-r{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;background:var(--soft);transition:border-color .15s,box-shadow .15s}.cp-r:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s);background:#fff}
.cp-r textarea{flex:1;resize:none;min-height:30px;max-height:180px;border:0;background:none;outline:none;padding:6px 0}.cp-r .btn{min-height:36px}
.cp.nt .cp-r{background:#FFFBEA;border-color:#E2BC4A}
.semsel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:30px;gap:6px}
.semsel .ic{width:72px;height:72px;border-radius:20px;background:#fff;box-shadow:var(--sh2);color:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:8px}.semsel .ic svg.i{width:32px;height:32px}
/* perfil */
.pf{background:#fff;border-left:1px solid var(--line);overflow-y:auto;padding:0}
.app{position:relative}.pf-aba{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:6;width:24px;height:68px;padding:0;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:#fff;color:var(--mut);align-items:center;justify-content:center;cursor:pointer;box-shadow:-6px 0 18px rgba(10,23,51,.09)}.pf-aba:hover{color:var(--pri);width:28px}.pf-aba svg{width:15px;height:15px;transform:rotate(180deg)}
@media (min-width:1281px){.app{transition:grid-template-columns .28s ease}.app.sem-pf{grid-template-columns:248px minmax(320px,380px) minmax(0,1fr) 0}.emb .app.sem-pf{grid-template-columns:220px minmax(290px,340px) minmax(0,1fr) 0}.app.sem-pf .pf{border-left:0;overflow:hidden}.pf>*{min-width:290px}.app.sem-pf .pf:not(:empty)~.pf-aba{display:flex}}
.pf-top{padding:22px 18px 16px;text-align:center;border-bottom:1px solid var(--line2);position:relative}.pf-top .av{width:64px;height:64px;font-size:22px;margin:0 auto 10px}.pf-top h3{margin:0;font-size:17px}.pf-top .x{position:absolute;right:10px;top:10px}
.pf-sec{padding:14px 18px;border-bottom:1px solid var(--line2)}.pf-sec h4{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:13.5px}.kv span{color:var(--mut)}.kv b{font-weight:600;text-align:right;word-break:break-word}.kv a{color:var(--pri);text-decoration:none}
.tg{display:flex;flex-wrap:wrap;gap:5px}
.hist div{padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}.hist div:last-child{border:0}.hist div:hover b{color:var(--pri)}
/* kanban */
.kb{grid-column:2/5;display:flex;flex-direction:column;min-width:0;min-height:0}
.kb-top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:64px}.kb-top h2{margin:0;font-size:19px;letter-spacing:-.01em}
.kb-c{flex:1;display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;padding:16px 20px;overflow:auto}
.col{background:#ECEBF3;border-radius:14px;display:flex;flex-direction:column;min-height:0}.col.alvo{outline:2px dashed var(--pri);outline-offset:-3px;background:var(--pri-s)}
.col-h{padding:12px 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}.col-h i{width:8px;height:8px;border-radius:50%}.col-h span{margin-left:auto;font-size:12px;background:#fff;border-radius:99px;padding:0 9px;line-height:20px;color:var(--mut);font-weight:600}
.col-b{padding:0 10px 10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px}
.kc{background:#fff;border-radius:12px;padding:11px 12px;box-shadow:var(--sh);cursor:grab;border:1px solid transparent}.kc:hover{border-color:#C9D8FF}.kc.arr{opacity:.45}
.kc .l1{display:flex;gap:8px;align-items:center}.kc .l1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.kc p{margin:6px 0 8px;color:var(--mut);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .l3{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
/* modal e toast */
.ov{position:fixed;inset:0;background:rgba(10,23,51,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.md{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(10,23,51,.3)}
.md-h{padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}.md-h h3{margin:0;flex:1;font-size:17px;letter-spacing:-.01em}.md-h button{border:0;background:none;color:var(--mut);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}.md-h button:hover{background:var(--hover)}
.md-b{padding:18px 20px;overflow-y:auto}.md-f{padding:12px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--soft);border-radius:0 0 16px 16px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}.chk:has(input:checked){background:var(--pri-s);border-color:#C9D8FF;color:var(--pri-d)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;box-shadow:var(--sh2);max-width:90vw;animation:fd .2s}#toast div.e{background:var(--bad)}
.voltar{display:none}.menu-m{display:none!important}
.qr-box{text-align:center}.qr-box .grande{width:56px;height:56px;border-radius:16px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}.qr-box .grande svg.i{width:28px;height:28px}
.emb .nav .brand{display:none}.emb .ch-h select{min-width:0;max-width:150px}.ch-h .nm{min-width:110px}.semsel .pill{white-space:normal;line-height:1.4;padding:4px 12px;max-width:90%}

.lgx::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,10,30,.55) 0%,rgba(4,10,30,.15) 45%,rgba(4,10,30,0) 60%)}
.lgx>*{position:relative}
.lgx-mk{display:flex;align-items:center;gap:16px}.lgx-mk img{height:clamp(40px,4vw,58px);width:auto}.lgx-mk .tx{border-left:2px solid #1E7BFF;padding-left:16px}.lgx-mk b{display:block;font-size:clamp(26px,3vw,42px);font-weight:800;letter-spacing:.02em;line-height:1;color:#2E8BFF}.lgx-mk small{display:block;font-size:clamp(10px,.9vw,13px);letter-spacing:.38em;color:rgba(255,255,255,.85);margin-top:6px}
.lgx-l{align-self:start;margin-top:clamp(10px,6vh,90px);max-width:560px}
.lgx-l h1{font-size:clamp(30px,3.4vw,48px);line-height:1.08;letter-spacing:-.02em;margin:clamp(30px,7vh,70px) 0 0;font-weight:700}.lgx-l h1 em{font-style:normal;color:#2E8BFF}
.lgx-l p{margin:18px 0 0;font-size:clamp(15px,1.2vw,18px);color:rgba(255,255,255,.85);max-width:430px;line-height:1.5}
.lgx-f{display:flex;margin-top:30px}.lgx-f div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;font-size:13px;line-height:1.3;color:rgba(255,255,255,.88);padding:0 16px;border-left:1px solid rgba(255,255,255,.18)}.lgx-f div:first-child{border-left:0;padding-left:0}.lgx-f svg.i{width:30px;height:30px;color:#3D8BFF;stroke-width:1.6}
.lgx-c{background:linear-gradient(160deg,rgba(13,27,66,.78),rgba(6,14,38,.86));border:1.5px solid rgba(46,139,255,.55);border-radius:26px;padding:clamp(28px,3vw,44px) clamp(24px,2.6vw,40px);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 0 1px rgba(46,139,255,.15),0 30px 80px rgba(0,8,40,.6),0 0 60px rgba(30,123,255,.25)}
.lgx-c .lgx-mk{justify-content:center}.lgx-c .lgx-mk img{height:46px}.lgx-c .lgx-mk b{font-size:34px}
.lgx-c h2{font-size:26px;margin:34px 0 8px;letter-spacing:-.01em}.lgx-c .sub{color:rgba(255,255,255,.78);margin:0 0 26px;line-height:1.5}
.lgx-in{position:relative;margin-bottom:16px}.lgx-in svg.i{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:rgba(255,255,255,.75)}
.lgx-in input{width:100%;height:58px;border-radius:12px;border:1.5px solid rgba(46,139,255,.45);background:rgba(4,12,34,.55);color:#fff;padding:0 50px 0 52px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}.lgx-in input::placeholder{color:rgba(255,255,255,.6)}.lgx-in input:focus{border-color:#2E8BFF;box-shadow:0 0 0 3px rgba(46,139,255,.25)}
.lgx-in button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:rgba(255,255,255,.75);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px}.lgx-in button svg.i{position:static;transform:none}
.lgx-go{width:100%;height:58px;border:0;border-radius:12px;background:linear-gradient(90deg,#1A5CFF,#2E8BFF);color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;box-shadow:0 10px 30px rgba(26,92,255,.45);transition:filter .15s}.lgx-go:hover{filter:brightness(1.08)}.lgx-go:disabled{opacity:.6}.lgx-go svg.i{width:22px;height:22px}
.lgx-esq{display:block;margin:20px auto 0;background:none;border:0;color:#3D9BFF;text-decoration:underline;font-size:14.5px}
.lgx-err{background:rgba(194,59,59,.18);border:1px solid rgba(255,120,120,.4);color:#FFD5D5;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 14px}.lgx-ok{background:rgba(14,138,95,.2);border-color:rgba(80,220,160,.4);color:#C9F7E3}
.lgx-seg{display:flex;gap:14px;align-items:center;margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14)}.lgx-seg svg.i{width:34px;height:34px;color:#3D8BFF;stroke-width:1.6}.lgx-seg b{display:block;font-weight:600;font-size:14.5px}.lgx-seg span{font-size:12.5px;color:rgba(255,255,255,.7)}
.lgx-rod{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:rgba(255,255,255,.5)}.lgx-rod a{color:rgba(255,255,255,.7);margin:0 6px}
@media (max-width:980px){.lgx{grid-template-columns:1fr;justify-items:center;background-position:30% center;padding-bottom:60px}.lgx::before{background:rgba(4,10,30,.55)}.lgx-l{display:none}.lgx-c{width:100%;max-width:470px}}
@media (max-width:420px){.lgx-c{padding:26px 20px}.lgx-c .lgx-mk img{height:38px}.lgx-c .lgx-mk b{font-size:28px}.lgx-c h2{font-size:23px;margin-top:26px}}

@media (max-width:1280px){.app,.emb .app{grid-template-columns:220px minmax(280px,340px) minmax(0,1fr)}.pf{display:none}.pf.aberto{display:block;position:fixed;right:0;top:0;bottom:0;width:330px;z-index:40;box-shadow:-10px 0 40px rgba(10,23,51,.15)}.kb{grid-column:2/4}}
@media (max-width:900px){.app,.emb .app{grid-template-columns:1fr}.nav{display:none}.nav.aberto{display:flex;position:fixed;inset:0 25% 0 0;z-index:45;box-shadow:20px 0 50px rgba(0,0,0,.3)}.lst{border:0}.app.chat .lst{display:none}.app:not(.chat) .ch{display:none}.voltar{display:inline-flex}.kb{grid-column:1}.kb-c{grid-template-columns:repeat(4,86vw);padding:12px}.m{max-width:86%}.ch-b{padding:14px 10px}.menu-m{display:inline-flex!important}.ch-h select{min-width:0;max-width:120px}.ch-acoes .tx-b{display:none}.lg{grid-template-columns:1fr}.lg-art{display:none}}

.pill svg.i{width:12px;height:12px}.pill.risco{background:var(--bad-s);color:var(--bad)}.pill.fu{background:var(--pri-s);color:var(--pri)}
.cp{position:relative}.cp-r .ib.mic{border:0;background:none;width:36px;height:36px}.cp-r .ib.mic:hover{color:var(--pri);background:var(--pri-s)}
.sug{position:absolute;left:16px;right:16px;bottom:calc(100% - 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(10,23,51,.18);max-height:330px;overflow:auto;z-index:20;padding:6px}
.sug-h{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:6px 8px 4px}.sug-h span{text-transform:none;letter-spacing:0;font-weight:500}

.at-n{display:grid;grid-template-columns:190px 1fr;gap:8px}.at-i{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}.at-i>b{color:var(--pri);min-width:90px}.at-i div{flex:1;min-width:0}.at-i span{font-weight:600;font-size:13px}.at-i p{margin:2px 0 0;font-size:13px;color:var(--mut);white-space:pre-wrap}.at-p{display:flex;flex-wrap:wrap;gap:6px}

      if (!r.ok) continue; const j = await r.json(), t = j.choices && j.choices[0] && j.choices[0].message.content; if (t) return String(t).trim(); } catch (e) { }

/* ---------- respostas rápidas com atalho (digite / no campo de mensagem) ---------- */
function listaAtalhos(i) {

}
function ligarAtalhos(t, i, cresce) {
  const cp = $('#cp'); let box = null, sel = 0, achados = [], ini = -1;
  const fecharS = () => { if (box) box.remove(); box = null; achados = []; };
  const escolher = k => { const x = achados[k]; if (!x) return; const fim = t.selectionStart, txt = preencher(x.texto, i); t.value = t.value.slice(0, ini) + txt + t.value.slice(fim); const p = ini + txt.length; fecharS(); t.focus(); t.setSelectionRange(p, p); cresce(); };
  const pintar = () => {
    if (!achados.length) return fecharS();
    if (!box) { box = document.createElement('div'); box.className = 'sug'; box.setAttribute('role', 'listbox'); box.setAttribute('aria-label', 'Respostas rápidas'); cp.appendChild(box); }
    box.innerHTML = `<div class="sug-h">Respostas rápidas<span>↑↓ escolher · Enter inserir · Esc fechar</span></div>${achados.map((x, k) => `<div class="sug-i ${k === sel ? 'on' : ''}" data-k="${k}" role="option" aria-selected="${k === sel}"><b>/${esc(x.a)}</b><span>${esc(x.titulo)}</span><p>${esc(preencher(x.texto, i).slice(0, 120))}</p></div>`).join('')}`;

  };

    ini = antes.length - mm[2].length - 1; const q = slug(mm[2]), l = listaAtalhos(i);
    achados = (q ? [...l.filter(x => x.a.startsWith(q)), ...l.filter(x => !x.a.startsWith(q) && (x.a.includes(q) || slug(x.titulo).includes(q)))] : l).slice(0, 8); sel = 0; pintar();
  };
  t.addEventListener('input', ver); t.addEventListener('blur', () => setTimeout(fecharS, 150));

    if (!box) return;

function retornosPerfilHTML(i) {

  return `<div class="pf-sec"><h4>Retornos</h4>${l.length ? `<div class="kv" style="margin-bottom:10px">${l.map(r => `<span style="${new Date(r.quando) < new Date() ? 'color:var(--bad)' : ''}">${dataHora(r.quando)}</span><b>${esc(r.nota || 'Retorno')}</b>`).join('')}</div>` : '<p class="hint" style="margin:0 0 10px">Nenhum retorno agendado.</p>'}<button class="btn sec sm" id="pf-rt">${I('calendario')}Agendar retorno</button></div>`;
}

/* ---------- follow-up automático (quem envia é o programa NEXUM WhatsApp, a partir da versão 1.2) ---------- */
const FU_PADRAO = { ativo: false, soHorario: true, regras: [{ horas: 24, texto: 'Oi, {nome}! Passando para saber se conseguiu ver a minha última mensagem. Posso te ajudar em mais alguma coisa? 😊' }, { horas: 48, texto: 'Oi, {nome}! Vou deixar este atendimento em aberto por aqui. Quando quiser continuar, é só responder esta mensagem. 💙' }] };
function fuPerfilHTML(i) {
  const f = C.followup; if (i.canal !== 'wa' || !f || !f.ativo) return '';
  const c = i.raw, n = +c.followupN || 0, rg = f.regras || [], tot = rg.length; let st;
  if (c.followupPausado) st = 'Pausado nesta conversa';
  else if (i.etapa === 'fim') st = 'Conversa finalizada';
  else if (n >= tot) st = `Os ${tot} lembretes já foram enviados`;
  else if (c.ultimaDe !== 'equipe') st = c.ultimaDe === 'cliente' ? 'Aguardando a equipe responder' : 'Começa depois da próxima mensagem da equipe';
  else { const falta = Math.round((Date.parse(c.atualizadoEm || '') + rg[n].horas * 3600e3 - Date.now()) / 6e4); st = falta > 0 ? `${n + 1}º lembrete em ${minFmt(falta)}${f.soHorario !== false ? ' (no horário de atendimento)' : ''}` : `${n + 1}º lembrete sai na próxima verificação`; }
  return `<div class="pf-sec"><h4>Follow-up automático</h4><div class="fu-st"><span>${I('repetir')}${esc(st)}</span><button class="btn sec sm" id="pf-fu">${c.followupPausado ? 'Retomar' : 'Pausar'}</button></div>${n ? `<p class="hint" style="margin:6px 0 0">${n} lembrete${n > 1 ? 's' : ''} já enviado${n > 1 ? 's' : ''} nesta conversa.</p>` : ''}</div>`;
}
function configuracoes(aba) {
  modal('Configurações do CRM', `<div class="tabs" role="tablist"><button role="tab" data-cab="atalhos">Respostas rápidas</button>${dono() ? '<button role="tab" data-cab="followup">Follow-up automático</button>' : ''}</div><div id="cfg-b" style="margin-top:14px"></div>`, { largo: true, foot: '<button class="btn sec" data-close>Fechar</button>', onMount: m => {
    const ir = a => { $$('[data-cab]', m).forEach(b => { b.classList.toggle('on', b.dataset.cab === a); b.setAttribute('aria-selected', b.dataset.cab === a); }); (a === 'followup' ? cfgFollowup : cfgAtalhos)($('#cfg-b', m)); };
    $$('[data-cab]', m).forEach(b => b.onclick = () => ir(b.dataset.cab)); ir(dono() && aba === 'followup' ? 'followup' : 'atalhos');
  } });
}
function cfgAtalhos(el) {
  const meus = C.atalhos || [];
  el.innerHTML = `<p class="hint" style="margin-top:0">No campo de mensagem, digite <b>/</b> e o começo do atalho (ex.: <b>/pix</b>) para inserir a resposta pronta. Use <b>{nome}</b>, <b>{empresa}</b>, <b>{plano}</b>, <b>{vencimento}</b> e <b>{atendente}</b>: o CRM troca pelos dados do cliente.</p>
    <div class="at-n"><input class="inp" id="at-a" placeholder="Atalho (ex.: pix)" maxlength="24" aria-label="Atalho"><input class="inp" id="at-t" placeholder="Título (ex.: Chave PIX)" maxlength="60" aria-label="Título"></div>
    <textarea class="inp" id="at-x" rows="3" placeholder="Texto da resposta" maxlength="1500" style="margin-top:8px" aria-label="Texto da resposta"></textarea><div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn sm" id="at-s">${I('mais')}Salvar atalho</button></div>
    <h4 class="rt-g">Atalhos da equipe<span>${meus.length}</span></h4>${meus.length ? meus.map((x, k) => `<div class="at-i"><b>/${esc(x.atalho)}</b><div><span>${esc(x.titulo || '')}</span><p>${esc(x.texto)}</p></div><button class="ib" data-atd="${k}" title="Apagar" aria-label="Apagar o atalho ${esc(x.atalho)}">${I('lixo')}</button></div>`).join('') : '<p class="hint">Nenhum atalho criado ainda.</p>'}
    <h4 class="rt-g">Atalhos prontos</h4><div class="at-p">${listaAtalhos(null).filter(x => x.grupo !== 'Da equipe').map(x => `<span class="pill" title="${esc(x.texto)}">/${esc(x.a)}</span>`).join('')}</div>`;
  const salvar = async l => { await FB.db.doc('plataforma/crm').set({ atalhos: l }, { merge: true }); C.atalhos = l; cfgAtalhos(el); };
  $('#at-s', el).onclick = async () => { const a = slug($('#at-a', el).value), x = $('#at-x', el).value.trim(); if (!a) return toast('Escreva o atalho.', true); if (!x) return toast('Escreva o texto da resposta.', true);
    try { await salvar([...meus.filter(y => y.atalho !== a), { atalho: a, titulo: $('#at-t', el).value.trim() || a, texto: x, por: C.nome }]); toast(`Atalho /${a} salvo.`); } catch (e) { toast(e.code || e.message, true); } };
  $$('[data-atd]', el).forEach(b => b.onclick = async () => { try { await salvar(meus.filter((_, k) => k !== +b.dataset.atd)); toast('Atalho apagado.'); } catch (e) { toast(e.code || e.message, true); } });
}
function cfgFollowup(el) {
  const f = { ...FU_PADRAO, ...(C.followup || {}) }, rg = (f.regras && f.regras.length ? f.regras : FU_PADRAO.regras).slice(0, 3);
  const aviso = !webOn() ? '<div class="aviso">O follow-up sai pelo WhatsApp conectado pelo QR code. Deixe o programa NEXUM WhatsApp ligado e o número conectado.</div>' : webVersao() < 1.2 ? '<div class="aviso">Atualize o programa NEXUM WhatsApp no computador para a versão 1.2. A versão atual não manda follow-up.</div>' : '';
  el.innerHTML = `${aviso}<p class="hint" style="margin-top:0">Quando a equipe manda uma mensagem e o cliente não responde, o CRM manda um lembrete sozinho. Se o cliente responder, a contagem zera. Dá para pausar em cada conversa, no perfil do cliente.</p>
    <label class="row sw"><input type="checkbox" id="fu-on" ${f.ativo ? 'checked' : ''}> <b>Ligar o follow-up automático</b></label>
    ${[0, 1, 2].map(k => { const r = rg[k] || { horas: '', texto: '' }; return `<div class="fu-r"><div class="fu-h"><span class="fu-n">${k + 1}º lembrete</span><span class="hint">depois de</span><input class="inp" type="number" min="1" max="720" id="fu-h${k}" value="${esc(r.horas)}" placeholder="—" style="width:76px" aria-label="Horas do ${k + 1}º lembrete"><span class="hint">horas sem resposta${k ? ', contando do lembrete anterior' : ''}${k === 2 ? ' (opcional)' : ''}</span></div><textarea class="inp" id="fu-t${k}" rows="2" aria-label="Texto do ${k + 1}º lembrete">${esc(r.texto)}</textarea></div>`; }).join('')}
    <label class="row" style="margin-top:12px"><input type="checkbox" id="fu-hr" ${f.soHorario !== false ? 'checked' : ''}> Mandar só no horário de atendimento (${HORARIO})</label>
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" id="fu-s">Salvar</button></div>`;
  $('#fu-s', el).onclick = async () => {
    const regras = [0, 1, 2].map(k => ({ horas: Math.min(720, Math.round(+$(`#fu-h${k}`, el).value || 0)), texto: $(`#fu-t${k}`, el).value.trim().slice(0, 1000) })).filter(r => r.horas > 0 && r.texto);
    const on = $('#fu-on', el).checked; if (on && !regras.length) return toast('Preencha pelo menos o 1º lembrete (horas e texto).', true);
    const d = { ativo: on, soHorario: $('#fu-hr', el).checked, regras, atualizadoEm: agora(), por: C.nome };
    try { await FB.db.doc('plataforma/crm').set({ followup: d }, { merge: true }); C.followup = d; toast(on ? 'Follow-up automático ligado.' : 'Follow-up automático desligado.'); } catch (e) { toast(e.code || e.message, true); }
  };
}

/* ---------- foto, documento e áudio pelo WhatsApp (programa NEXUM WhatsApp 1.2) ---------- */
const lerArquivo = f => new Promise((ok, er) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = er; r.readAsDataURL(f); });
const reduzirImg = data => new Promise(ok => { const im = new Image(); im.onload = () => { const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .82)); }; im.onerror = () => ok(data); im.src = data; });
function midiaPronta() {
  if (!webOn()) { toast('Para mandar fotos, áudios e documentos, conecte o WhatsApp pelo QR code (botão WhatsApp, no menu).', true); return false; }
  if (webVersao() < 1.2) { toast('Atualize o programa NEXUM WhatsApp no computador para a versão 1.2 para mandar fotos, áudios e documentos.', true); return false; }
  return true;
}
async function anexarWA(i, f, legenda = '') {
  if (!midiaPronta()) return; if (f.size > 8e6) return toast('Arquivo grande demais (máximo 8 MB).', true);
  try {
    let data = await lerArquivo(f), tipo = (f.type || 'application/octet-stream').split(';')[0];
    if (/^image\/(jpeg|png|webp|bmp)$/.test(tipo)) { data = await reduzirImg(data); tipo = 'image/jpeg'; }
    if (data.length > 900000) return toast('Arquivo grande demais para mandar pelo CRM (máximo de uns 650 KB). Mande um arquivo menor.', true);
    const nome = String(f.name || (tipo.startsWith('audio/') ? 'audio' : 'arquivo')).slice(0, 120), rot = tipo.startsWith('image/') ? '📷 Foto' : tipo.startsWith('audio/') ? '🎤 Áudio' : tipo.startsWith('video/') ? '🎬 Vídeo' : '📄 ' + nome;
    const ref = FB.db.collection('wa_conversas').doc(i.id), em = agora(), t = legenda || rot;
    const m = await ref.collection('msgs').add({ de: 'equipe', t, em, por: C.user.email, envio: 'pendente', anexo: { nome, tipo, data } });
    await FB.db.collection('wa_fila').add({ conv: i.id, texto: legenda, msg: m.id, por: C.user.email, em, anexo: true });
    await ref.set({ ultimaMsg: t.slice(0, 160), ultimaDe: 'equipe', atualizadoEm: em, naoLidas: 0, followupN: 0, etapaCrm: 'aguardando', ...(!i.raw.atendenteEmail ? { atendente: C.nome, atendenteEmail: C.user.email } : {}) }, { merge: true });
  } catch (e) { toast('Não foi possível mandar o arquivo: ' + (e.code || e.message), true); }
}
function anexar(i, f) {
  if (!i || !f) return; if (i.canal === 'sistema') return anexarSup(i, f); if (i.canal !== 'wa') return;
  const t = $('#cp-t'), leg = t && !C.nota && !/^audio\//.test(f.type) ? t.value.trim() : ''; if (leg) { t.value = ''; t.style.height = ''; }
  return anexarWA(i, f, leg);
}
let GRV = null;
async function gravarAudio(i) {
  if (!midiaPronta()) return; if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Este navegador não grava áudio. Use o Chrome ou o Edge.', true);
  let st; try { st = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast('Libere o microfone no navegador para gravar áudio.', true); }
  const tipo = ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm'].find(x => MediaRecorder.isTypeSupported(x)) || '';
  const rec = new MediaRecorder(st, { ...(tipo ? { mimeType: tipo } : {}), audioBitsPerSecond: 24000 }), partes = [], ini = Date.now();
  GRV = { rec, cancelado: false, tm: 0 };
  rec.ondataavailable = e => { if (e.data && e.data.size) partes.push(e.data); };
  rec.onstop = async () => {
    st.getTracks().forEach(x => x.stop()); clearInterval(GRV && GRV.tm); const canc = !GRV || GRV.cancelado; GRV = null; desenharComposer(); if (canc) return;
    const tp = (rec.mimeType || tipo || 'audio/webm').split(';')[0], b = new Blob(partes, { type: tp }); if (b.size < 1200) return toast('Áudio muito curto.', true);
    await anexarWA(i, new File([b], 'audio.' + (tp.includes('ogg') ? 'ogg' : 'webm'), { type: tp }));
  };
  rec.start(250);
  const cp = $('#cp'); cp.className = 'cp';
  cp.innerHTML = `<div class="grv" role="status"><span class="grv-p"></span><b>Gravando áudio</b><span id="grv-t">0:00</span><span class="sp"></span><button class="btn sec sm" id="grv-x">${I('lixo')}Cancelar</button><button class="btn sm" id="grv-ok">${I('enviar')}Enviar</button></div>`;
  GRV.tm = setInterval(() => { const s = Math.round((Date.now() - ini) / 1000), e = $('#grv-t'); if (e) e.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s >= 120 && rec.state === 'recording') rec.stop(); }, 500);
  $('#grv-x').onclick = () => { if (GRV) GRV.cancelado = true; rec.stop(); }; $('#grv-ok').onclick = () => rec.stop();
}

/* ---------------- início ---------------- */
(function init() {
  if (EMBED) document.documentElement.classList.add('emb');
  if (typeof firebase === 'undefined') { $('#root').innerHTML = '<p style="padding:30px">Não foi possível carregar o sistema. Confira a internet e atualize a página.</p>'; return; }
  /* mesmo nome de app do Painel do Adm: quem já entrou no painel (ou no Portal da Equipe) entra direto aqui */
  const app = firebase.initializeApp(FIREBASE_CONFIG, 'nexum-admin'); FB = { auth: app.auth(), db: app.firestore() };
  FB.auth.onAuthStateChanged(async u => {
    C.subs.forEach(x => x()); C.subs = [];
    if (!u) { C.user = null; return telaLogin(); }
    const p = await papelDe(u); if (!p) { await FB.auth.signOut(); return telaLogin('Este e-mail não tem acesso ao CRM. Peça acesso à proprietária.'); }
    C.user = { email: String(u.email || '').toLowerCase() }; C.uid = u.uid; C.papel = p.papel; C.nome = p.nome; C.iniciou = false;
    desenhar(); ouvir(); setTimeout(() => { C.iniciou = true; if (C.view === 'inbox') desenharLista(); }, 1500);
    try { if ('Notification' in window && Notification.permission === 'default') setTimeout(() => Notification.requestPermission().catch(() => { }), 4000); } catch (e) { }
  });
  setInterval(() => { if (C.user && $('#lst') && !document.hidden) { const a = document.activeElement; if (!(a && a.closest && a.closest('#lst'))) desenharLista(); } }, 60000);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#mr').innerHTML) fechar(); });
  setInterval(checarRetornos, 30000);
})();
</script>
