.md-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.md-h h3{margin:0;flex:1;font-size:17px}.md-h button{border:0;background:none;font-size:22px;color:var(--mut)}
.md-b{padding:16px 20px;overflow-y:auto}.md-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{margin-bottom:12px}.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}

@media (max-width:1280px){.app,.emb .app{grid-template-columns:200px minmax(260px,330px) minmax(0,1fr)}.pf{display:none}.pf.aberto{display:block;position:fixed;right:0;top:0;bottom:0;width:320px;z-index:40;box-shadow:-10px 0 40px rgba(0,0,0,.15)}.kb{grid-column:2/4}}
@media (max-width:900px){.app,.emb .app{grid-template-columns:1fr}.nav{display:none}.nav.aberto{display:flex;position:fixed;inset:0 30% 0 0;z-index:45}.lst{border:0}.app.chat .lst{display:none}.app:not(.chat) .ch{display:none}.voltar{display:inline-flex}.kb{grid-column:1}.kb-c{grid-template-columns:repeat(4,85vw)}.m{max-width:88%}.ch-b{padding:14px 10px}.menu-m{display:inline-flex!important}}
.menu-m{display:none!important}
</style>

  if (m.de === 'nota') return `<div class="m nota"><small>📝 Nota interna · ${esc(m.por || '')}</small>${esc(m.t)}<span class="h">${h} · só a equipe vê</span></div>`;
  const cli = i.canal === 'sistema' ? m.de === 'rh' : m.de === 'cliente', bot = m.de === 'bot';
  const quem = cli ? '' : bot ? '<small>Assistente</small>' : (m.por ? `<small>${esc(String(m.por).split('@')[0])}</small>` : '');
  const st = cli ? '' : m.envio === 'pendente' ? ' · enviando…' : m.envio === 'erro' ? ` · <b style="color:var(--bad)">não enviada${m.erro ? ': ' + esc(m.erro) : ''}</b>` : m.envio === 'manual' ? ' · pelo celular' : m.status === 'lida' ? ' <b style="color:#1A5CFF">✓✓</b>' : m.status === 'entregue' ? ' ✓✓' : ' ✓';

  let r; try { r = await fetch(C.asaasUrl + rota, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + await token() }, body: JSON.stringify(body) }); } catch (e) { throw new Error('Sem conexão com o conector.'); }

  el.innerHTML = `<div class="kb-top"><button class="btn ghost sm menu-m" id="kb-menu">☰</button><h2 style="margin:0;font-size:18px">Kanban de atendimento</h2><span class="sp"></span><input class="inp" id="kb-q" placeholder="Buscar" value="${esc(C.f.q)}" style="max-width:260px"><button class="btn sm" id="kb-nova">+ Nova</button></div>
    <div class="kb-c">${ETAPAS.map(([k, n, c]) => { const l = ordenar(todos.filter(i => i.etapa === k && (k !== 'fim' || String(i.em) >= new Date(Date.now() - 7 * 864e5).toISOString()))); return `<div class="col" data-col="${k}"><div class="col-h" style="border-top-color:${c}">${n}<span>${l.length}</span></div><div class="col-b">${l.map(i => `<div class="kc" draggable="true" data-kc="${esc(i.key)}" tabindex="0"><div class="l1">${cartaoAv(i, 30)}<b>${esc(i.nome)}</b>${i.naoLidas ? `<i class="nl" style="background:var(--wa);color:#fff;font-style:normal;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px">${i.naoLidas}</i>` : ''}</div><p>${esc(String(i.ultima).replace(/\*/g, ''))}</p><div class="l3" style="display:flex;gap:4px;flex-wrap:wrap">${tagsHTML(i)}<span class="hint" style="margin-left:auto">${quando(i.em)}</span></div></div>`).join('') || '<p class="hint" style="text-align:center;margin:20px 0">Arraste um cartão para cá.</p>'}</div></div>`; }).join('')}</div>`;
  $('.kb-c', el).scrollLeft = sc; $('#kb-nova', el).onclick = novaConversa; $('#kb-menu', el).onclick = () => $('#nav').classList.toggle('aberto');
  let tq; $('#kb-q', el).oninput = e => { clearTimeout(tq); tq = setTimeout(() => { C.f.q = e.target.value; desenharKanban(); const q = $('#kb-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); };
  $$('.kc', el).forEach(k => { k.onclick = () => abrir(k.dataset.kc); k.onkeydown = e => { if (e.key === 'Enter') abrir(k.dataset.kc); }; k.ondragstart = e => { e.dataTransfer.setData('text/plain', k.dataset.kc); k.classList.add('arr'); }; k.ondragend = () => k.classList.remove('arr'); });
  $$('.col', el).forEach(c => { c.ondragover = e => { e.preventDefault(); c.classList.add('alvo'); }; c.ondragleave = e => { if (!c.contains(e.relatedTarget)) c.classList.remove('alvo'); }; c.ondrop = e => { e.preventDefault(); c.classList.remove('alvo'); moverEtapa(e.dataTransfer.getData('text/plain'), c.dataset.col); }; });
}
async function moverEtapa(key, et) {
  const i = itens().find(x => x.key === key); if (!i || i.etapa === et) return;
  if (et === 'fim') { C.sel = key; return finalizar(i); }
  try {
    if (i.canal === 'wa') await atualizar(i, et === 'novo' ? { coluna: 'ia', etapa: 'menu', fila: '' } : { coluna: i.fila || (i.raw.coluna !== 'ia' && i.raw.coluna !== 'fim' ? i.raw.coluna : 'atend'), fila: i.fila || 'atend', etapa: 'fila', etapaCrm: et });
    else if (i.canal === 'sistema') await atualizar(i, { status: et === 'novo' ? 'bot' : 'analise', etapaCrm: et });
    else await atualizar(i, { status: et === 'novo' ? 'novo' : 'contato' });
    await registro(i, `Movido para ${ETAPAS.find(x => x[0] === et)[1]} por ${C.nome}`);
  } catch (e) { }
}

/* ---------------- início ---------------- */
(function init() {
  if (EMBED) document.documentElement.classList.add('emb');
  if (typeof firebase === 'undefined') { $('#root').innerHTML = '<p style="padding:30px">Não foi possível carregar o sistema. Confira a internet e atualize a página.</p>'; return; }
  /* mesmo nome de app do Painel do Adm: quem já entrou no painel (ou no Portal da Equipe) entra direto aqui */
  const app = firebase.initializeApp(FIREBASE_CONFIG, 'nexum-admin'); FB = { auth: app.auth(), db: app.firestore() };
  FB.auth.onAuthStateChanged(async u => {
    C.subs.forEach(x => x()); C.subs = [];
    if (!u) { C.user = null; return telaLogin(); }
    const p = await papelDe(u); if (!p) { await FB.auth.signOut(); return telaLogin('Este e-mail não tem acesso ao CRM. Peça acesso à proprietária.'); }
    C.user = { email: String(u.email || '').toLowerCase() }; C.uid = u.uid; C.papel = p.papel; C.nome = p.nome; C.iniciou = false;
    desenhar(); ouvir(); setTimeout(() => { C.iniciou = true; if (C.view === 'inbox') desenharLista(); }, 1500);
    try { if ('Notification' in window && Notification.permission === 'default') setTimeout(() => Notification.requestPermission().catch(() => { }), 4000); } catch (e) { }
  });
  setInterval(() => { if (C.user && $('#lst') && !document.hidden) { const a = document.activeElement; if (!(a && a.closest && a.closest('#lst'))) desenharLista(); } }, 60000);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#mr').innerHTML) fechar(); });
})();
</script>
