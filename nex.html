      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px"><label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" id="mt-p"> Usar também nos próximos meses</label><span style="flex:1"></span><button class="btn" id="mt-s">Salvar metas</button></div></section>
    <section class="card"><h2>Regras</h2><p class="h">A porcentagem das vendas é a mesma das Comissões do CRM (hoje ${d.regras.pct1}% da 1ª mensalidade${d.regras.pctRec ? ` + ${d.regras.pctRec}% das próximas ${d.regras.meses}` : ''}). Mude por lá.</p>
      <div class="grid">${[['vaga', 'Por vaga preenchida (R$)'], ['garantia', 'Garantia da vaga (dias)'], ['bonus', 'Bônus por meta batida (R$)'], ['ptVenda', 'Pontos por venda'], ['ptVaga', 'Pontos por vaga'], ['ptAtend', 'Pontos por atendimento']].map(([k, t]) => `<div class="fld"><label for="rg-${k}">${t}</label><input class="inp" id="rg-${k}" type="number" min="0" value="${+d.regras[k] || 0}"></div>`).join('')}</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px"><label style="display:flex;gap:8px;align-items:center;font-size:13.5px;flex:1"><input type="checkbox" id="rg-x" ${d.regras.exigirMeta ? 'checked' : ''}> Só liberar a comissão para quem bater todas as metas do mês</label><button class="btn" id="rg-s">Salvar regras</button></div></section>`;
  $$('[data-ver]', el).forEach(b => b.onclick = () => { N.quem = b.dataset.ver; N.view = 'meu'; carregar(); });
  $$('[data-pg]', el).forEach(b => b.onclick = async () => { const p = eq.find(x => x.email === b.dataset.pg); if (!confirm(`Marcar ${brl(p.total)} como pago para ${p.nome}?`)) return; b.disabled = true;
    try { await api('/api/nex/acao', { acao: 'pagar', mes: d.mes, email: p.email, valor: p.total, vendas: p.vendasValor || 0 }); toast('Marcado como pago.'); carregar(); } catch (e) { toast(e.message, true); b.disabled = false; } });
  $$('[data-at]', el).forEach(s => s.onchange = async () => { if (!s.value) return; try { await api('/api/nex/acao', { acao: 'atribuir', id: s.dataset.at, email: s.value }); toast('Responsável salvo.'); carregar(); } catch (e) { toast(e.message, true); } });
  $('#mt-s', el).onclick = async () => { const metas = {}; $$('[data-mt]', el).forEach(tr => { const o = {}; $$('[data-k]', tr).forEach(i => o[i.dataset.k] = +i.value || 0); metas[tr.dataset.mt] = o; });
    try { await api('/api/nex/acao', { acao: 'metas', mes: d.mes, metas, padrao: $('#mt-p', el).checked }); toast('Metas salvas.'); carregar(); } catch (e) { toast(e.message, true); } };
  $('#rg-s', el).onclick = async () => { const o = { acao: 'regras' }; ['vaga', 'garantia', 'bonus', 'ptVenda', 'ptVaga', 'ptAtend'].forEach(k => o[k] = +$('#rg-' + k, el).value || 0); o.exigirMeta = $('#rg-x', el).checked;
    try { await api('/api/nex/acao', o); toast('Regras salvas.'); carregar(); } catch (e) { toast(e.message, true); } };
}
try { firebase.initializeApp(FIREBASE_CONFIG); FB = { auth: firebase.auth(), db: firebase.firestore() }; FB.auth.onAuthStateChanged(u => { if (!u) { N.d = null; return telaLogin(); } $('#root').innerHTML = '<div class="login"><form class="box"><p>Carregando…</p></form></div>'; carregar(); }); }
catch (e) { document.getElementById('root').innerHTML = '<div class="login"><form class="box"><h1>Sem conexão</h1><p>Não foi possível carregar o NEX. Confira a internet e abra de novo.</p></form></div>'; }
</script>
</body></html>
